name: Build and Release Executables

on:
  push:
    tags:
        - 'v*'          # Builds on version release
  workflow_dispatch:    # Builds when run manually

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: e-series-solver-linux
            binary_path: dist/e-series-solver
          - os: windows-latest
            artifact_name: e-series-solver-windows
            binary_path: dist/e-series-solver.exe
          - os: macos-latest
            artifact_name: e-series-solver-macos
            binary_path: dist/e-series-solver

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install .

    - name: Build binary with PyInstaller
      run: |
        pyinstaller --onefile e_vals.py --name e-series-solver

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.binary_path }}
        if-no-files-found: error